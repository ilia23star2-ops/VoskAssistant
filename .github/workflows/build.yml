name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Vosk model from Release
        run: |
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          curl -L -o vosk-model-small-ru-0.22.zip \
            https://github.com/ilia23star2-ops/VoskAssistant/releases/download/v1.0/vosk-model-small-ru-0.22.zip
          unzip -q vosk-model-small-ru-0.22.zip
          rm vosk-model-small-ru-0.22.zip
          echo "=== Содержимое assets после распаковки ==="
          ls -la
          echo "=== Содержимое папки модели ==="
          ls -la vosk-model-small-ru-0.22/ | head -30

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
